[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "czech_air_quality"
version = "2.0.3"
description = "Python library for retrieving and processing current air quality data from the CHMI OpenData portal."
authors = [{ name = "chkndrp", email = "chkndrp@gmail.com" }]
keywords = [
    "air-quality", "chmi", "czechia", "pollution",
    "aqi", "eaqi", "geopy", "isko"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed"
]
dependencies = [
    "requests>=2.28.0",
    "geopy>=2.3.0",
]
license = "LGPL-3.0"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/chkndrp/czech_air_quality"
Issues     = "https://github.com/chkndrp/czech_air_quality/issues"
Changelog  = "https://github.com/chkndrp/czech_air_quality/blob/master/CHANGELOG.md"
Homepage   = "https://czech-air-quality.readthedocs.io"

[project.optional-dependencies]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "sphinx-autodoc-typehints>=3.5.0",
    "sphinxext-opengraph>=0.13.0",
    "sphinx-llms-txt>=0.7.1"
]

dev = [
    "pytest>=9.0.1",
    "coverage>=7.11.3",
    "pylint>=4.0.3",
]

[tool.pylint.main]
py-version = "3.10"
clear-cache-post-run = false
persistent = true
source-roots = ["src"]
ignore-paths = ["docs"]
load-plugins = [
    "pylint.extensions.check_elif",
    "pylint.extensions.docparams",
    "pylint.extensions.for_any_all",
    "pylint.extensions.set_membership",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.typing",
    "pylint.extensions.comparison_placement",
]

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "too-many-statements",
    "too-many-nested-blocks",
    "too-many-branches",
    "too-many-arguments",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "undefined-variable",
    "import-error",
]

[tool.pylint.basic]
argument-naming-style = "snake_case"
attr-naming-style = "snake_case"
class-attribute-naming-style = "UPPER_CASE"
class-const-naming-style = "UPPER_CASE"
class-naming-style = "PascalCase"
const-naming-style = "UPPER_CASE"
function-naming-style = "snake_case"
inlinevar-naming-style = "any"
method-naming-style = "snake_case"
module-naming-style = "snake_case"
no-docstring-rgx = "__.*__"
variable-naming-style = "snake_case"
include-naming-hint = true

[tool.pylint.classes]
check-protected-access-in-special-methods = true
exclude-protected = [
    "_data_manager",
    "_load_and_parse_data"
]

[tool.pylint.design]
max-args = 6
max-statements = 20
max-branches = 10
max-locals = 15

[tool.pylint.similarities]
min-similarity-lines = 4

[tool.pylint.string]
check-quote-consistency = true
check-str-concat-over-line-jumps = true

[tool.pylint.format]
max-line-length = 120

[tool.setuptools.packages.find]
include = ["czech_air_quality*"]
where = ["src"]

[tool.setuptools.package-data]
imagefv_extractor = ["py.typed"]
